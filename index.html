<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0A0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Annecy → Grindelwald · 02.11</title>
<style>
@font-face{font-family:"Inter Tight";font-weight:400;src:url(fonts/inter-tight-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Inter Tight";font-weight:500;src:url(fonts/inter-tight-latin-500-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Inter Tight";font-weight:600;src:url(fonts/inter-tight-latin-600-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Inter Tight";font-weight:700;src:url(fonts/inter-tight-latin-700-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Inter Tight";font-weight:800;src:url(fonts/inter-tight-latin-800-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Inter";font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Inter";font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Inter";font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Inter";font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2");font-display:swap}

:root{
  --bg0:#070A14;--bg1:#0E1424;--bg2:#162038;
  --ink:#F3EFE6;--ink-2:#C7C9D2;--muted:#8E95A8;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --gold:#E4B95B;--gold-2:#F6D98E;--gold-3:#A8792A;
  --red:#EB0000;--red-2:#FF4D3D;--blue:#0F3F8C;--blue-2:#1C5BC2;--yellow:#FFCC00;--amber:#FFB300;--green:#2FBF71;
  --card:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  --card-2:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  --gold-grad:linear-gradient(135deg,#F7DE9A 0%,#E4B95B 45%,#B9872F 100%);
  --red-grad:linear-gradient(135deg,#FF5A48,#D40000);
  --ease:cubic-bezier(.2,.7,.2,1);
  --dock-h:80px;
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;height:100%}
html{overflow-x:clip}
body{margin:0;min-height:100%;color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum","cv11";
  background:var(--bg0)}
.bgfx{position:fixed;top:0;left:0;right:0;height:130vh;z-index:-1;transform:translateZ(0);background:
  radial-gradient(900px 600px at 15% -10%,rgba(228,185,91,.16),transparent 60%),
  radial-gradient(800px 700px at 110% 30%,rgba(28,91,194,.22),transparent 60%),
  radial-gradient(700px 500px at 40% 110%,rgba(255,77,61,.10),transparent 60%),
  linear-gradient(180deg,var(--bg1),var(--bg0))}
.t{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}

/* ===== header ===== */
.hdr{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:linear-gradient(180deg,#0B1020,#0A0E1B);border-bottom:1px solid var(--line);will-change:transform;transform:translateZ(0)}
.hdr .row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px}
.hdr .route{font-family:"Inter Tight";font-weight:600;font-size:17px;letter-spacing:-.01em;margin-top:2px}
.clock{text-align:right;line-height:1}.clock .hm{font-size:22px;font-weight:700;letter-spacing:-.03em}.clock .s{font-size:12px;color:var(--muted);margin-left:3px;font-weight:500}.clock .z{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-family:Inter;font-weight:600}
/* linha de estações */
.line{padding:4px 10px 10px;overflow:hidden;transition:max-height .35s var(--ease),opacity .25s,padding .35s;max-height:90px}
.hdr.collapsed .line{max-height:0;padding-top:0;padding-bottom:0;opacity:0}
.slim{height:0;overflow:hidden;background:rgba(255,255,255,.08);transition:height .3s}.hdr.collapsed .slim{height:3px}.slim i{display:block;height:100%;width:0;background:var(--gold-grad);transition:width .6s var(--ease)}
.lt{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;background:rgba(255,255,255,.04)}.lt svg{width:18px;height:18px;fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}.hdr.collapsed .lt svg{transform:rotate(180deg)}
.line svg{display:block;width:100%;height:auto;overflow:visible}
.line .track{stroke:rgba(255,255,255,.14);stroke-width:3;fill:none;stroke-linecap:round}
.line .prog{stroke:url(#gProg);stroke-width:3;fill:none;stroke-linecap:round}
.line .node{fill:#0E1424;stroke:rgba(255,255,255,.55);stroke-width:1.6}
.line .node.done{fill:var(--gold);stroke:var(--gold-2)}
.line .node.cur{fill:#0E1424;stroke:var(--gold-2);stroke-width:2.2}
.line .nl{font-family:Inter;font-size:12.5px;font-weight:600;fill:var(--muted);text-anchor:middle;letter-spacing:.02em}
.line .nl.cur{fill:var(--ink)}
.line .nt{font-family:"JetBrains Mono";font-size:10.5px;fill:rgba(255,255,255,.35);text-anchor:middle}
.line .train{filter:drop-shadow(0 2px 6px rgba(228,185,91,.55))}
.line .hit{fill:transparent;cursor:pointer}

/* ===== layout ===== */
main{padding:14px 14px calc(var(--dock-h) + 28px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* ===== step card ===== */
.step{position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06)}
.photo{position:relative;height:150px;overflow:hidden}.photo .img{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transform-origin:center;will-change:transform}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,20,.05) 20%,rgba(7,10,20,.85) 100%)}
.photo .ph{position:absolute;left:18px;right:18px;bottom:14px;z-index:1}
.head{padding:18px 18px 8px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.photo + .brand{padding-top:14px}
.time{line-height:.9}
.time .h{font-family:"Inter Tight";font-weight:800;font-size:40px;letter-spacing:-.045em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.time .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px;font-family:Inter}
.cmd{font-family:"Inter Tight";font-weight:700;font-size:23px;line-height:1.08;letter-spacing:-.025em;margin-top:2px}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:8px;line-height:1.35}
.pills{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px 0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--line-2);color:var(--ink-2)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok{border-color:rgba(47,191,113,.4);color:#8FE3B4}.pill.ok i{background:var(--green);box-shadow:0 0 10px var(--green)}
.pill.late{border-color:rgba(255,179,0,.45);color:#FFD37A}.pill.late i{background:var(--amber)}
.pill.bad{border-color:rgba(255,77,61,.5);color:#FFA399}.pill.bad i{background:var(--red-2)}
.sign{padding:16px 18px 4px;display:flex;gap:14px;align-items:center}
.sign svg{flex:0 0 auto;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.sign .sx{font-size:14px;color:var(--ink-2);line-height:1.4}.sign .sx b{color:var(--ink);font-weight:700}
.diag{margin:14px 18px 0;background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:12px 10px 8px}
.diag svg{display:block;width:100%;height:auto;overflow:visible}
.diag .dl{font-family:Inter;font-size:12.5px;color:var(--muted);text-align:center;padding:8px 6px 2px;font-weight:600;letter-spacing:.01em}
.do{padding:14px 18px 6px}
.do .it{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.do .it:first-child{border-top:0;padding-top:4px}
.do .lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;padding-top:4px}
.do .lb.bag{color:var(--gold)}.do .lb.ear{color:#9CC4FF}.do .lb.off{color:var(--red-2)}.do .lb.say{color:#C9B8FF}.do .lb.see{color:var(--ink-2)}
.do .tx{font-size:15.5px;line-height:1.42;color:var(--ink)}.do .tx b{font-weight:700}
.do .tx .w{display:inline-block;background:rgba(255,255,255,.1);border:1px solid var(--line-2);padding:0 6px;border-radius:5px;font-weight:700}
.pb{margin:10px 18px 18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pb summary{list-style:none;padding:12px 14px;font-size:13.5px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;cursor:pointer}
.pb summary::-webkit-details-marker{display:none}
.pb .in{padding:0 14px 14px;font-size:14px;color:var(--ink-2);line-height:1.45}.pb .in b{color:var(--ink)}
.alert{margin:0 18px 14px;border-radius:14px;padding:14px 16px;font-weight:800;font-size:17px;line-height:1.25;background:var(--red-grad);color:#fff;box-shadow:0 12px 30px -10px rgba(235,0,0,.6)}
.alert.prep{background:var(--gold-grad);color:#1A1200;box-shadow:0 12px 30px -10px rgba(228,185,91,.6)}
.alert.warn{background:linear-gradient(135deg,#3B2A10,#241A0A);color:#FFD37A;font-weight:600;font-size:14px}
.alert.okk{background:linear-gradient(135deg,#0F3A26,#0B2A1B);color:#9CEFC0;font-weight:600;font-size:14px}


/* ===== temas por operador ===== */
.card.th{--acc:#E4B95B;--accgrad:var(--gold-grad);--tint:rgba(228,185,91,.10);border-color:color-mix(in srgb,var(--acc) 28%,transparent);background:linear-gradient(160deg,var(--tint),rgba(255,255,255,.02) 55%),var(--card)}
.card.th .time .h{background:var(--accgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card.th .time .k{color:var(--acc)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.brand .mark{white-space:nowrap;height:26px;padding:0 10px;border-radius:7px;display:inline-flex;align-items:center;font-family:"Inter Tight";font-weight:800;font-size:12.5px;letter-spacing:.02em}
.brand .sub{font-size:10.5px;line-height:1.3;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--acc)}
/* SBB: vermelho/branco */
.card.th-sbb{--acc:#FF6A5C;--accgrad:linear-gradient(135deg,#FFFFFF 0%,#FFD6D1 55%,#FF6A5C 100%);--tint:rgba(235,0,0,.12)}
.th-sbb .brand .mark{background:#EB0000;color:#fff}
/* GoldenPass Prestige */
.card.th-gold{--acc:#F2D48A;--accgrad:linear-gradient(135deg,#FFF3D0 0%,#F2D48A 40%,#C79A3C 100%);--tint:rgba(242,212,138,.14);background:radial-gradient(600px 300px at 50% -10%,rgba(242,212,138,.22),transparent 60%),linear-gradient(170deg,#1A1A1F,#0C0C10);border:1px solid rgba(242,212,138,.35);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 5px rgba(242,212,138,.08),0 40px 80px -40px rgba(0,0,0,.9)}
.th-gold .brand{padding-top:18px}
.th-gold .brand .mark{background:linear-gradient(135deg,#2A2A30,#141418);color:#F2D48A;border:1px solid rgba(242,212,138,.45);letter-spacing:.14em;font-weight:700;font-family:Inter}
.th-gold .head{position:relative}
.th-gold .head:before,.th-gold .head:after{content:"";position:absolute;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(242,212,138,.6),transparent)}
.th-gold .head:before{top:6px}.th-gold .head:after{bottom:0}
.th-gold .cmd{font-weight:600;letter-spacing:-.02em}
.th-gold .sub{color:#D9CFB8}
.th-gold .do .it{border-top-color:rgba(242,212,138,.14)}
.th-gold .diag{background:linear-gradient(160deg,rgba(242,212,138,.08),rgba(255,255,255,.015));border-color:rgba(242,212,138,.22)}
.th-gold .pb{border-color:rgba(242,212,138,.22)}
/* PostAuto */
.card.th-post{--acc:#FFD23F;--accgrad:linear-gradient(135deg,#FFF2B0 0%,#FFD23F 55%,#E0A800 100%);--tint:rgba(255,204,0,.12)}
.th-post .brand .mark{background:#FFCC00;color:#111}
/* BOB */
.card.th-bob{--acc:#8FB4FF;--accgrad:linear-gradient(135deg,#FFFFFF 0%,#BFD3FF 50%,#5B8DEF 100%);--tint:rgba(31,79,163,.22)}
.th-bob .brand .mark{background:linear-gradient(90deg,#1F4FA3 0 60%,#F5C518 60%);color:#fff}
/* BLS Bahnersatz */
.card.th-bls{--acc:#7ED99A;--accgrad:linear-gradient(135deg,#FFFFFF 0%,#C9F2D4 50%,#2E9B47 100%);--tint:rgba(46,155,71,.16)}
.card.th-bls .brand .mark{background:#2E9B47;color:#fff}
/* neutro (transfer, hotel) */
.card.th-neutral{--acc:#E4B95B}
.th-neutral .brand .mark{background:rgba(255,255,255,.08);color:var(--ink-2);border:1px solid var(--line-2)}


/* ===== celebração ===== */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.fin{padding:22px 18px 8px;text-align:center}
.fin .big{font-family:"Inter Tight";font-weight:800;font-size:44px;letter-spacing:-.04em;line-height:1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.fin .sm{margin-top:10px;color:var(--ink-2);font-size:15px}
.fin .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.fin .stats div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 8px}
.fin .stats .n{font-family:"Inter Tight";font-weight:800;font-size:24px;letter-spacing:-.03em}
.fin .stats .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.fin .toast-line{margin-top:18px;font-family:"Inter Tight";font-weight:600;font-size:19px;letter-spacing:-.02em;color:#F2D48A}

/* ===== dock ===== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0C1222,#080B16);border-top:1px solid var(--line);will-change:transform;transform:translateZ(0)}
.dock .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.dock .top{max-width:640px;margin:0 auto 8px;display:flex;justify-content:center}
.nb{height:50px;border-radius:16px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);display:grid;place-items:center;transition:transform .12s var(--ease),opacity .2s}
.nb:active{transform:scale(.96)}.nb[disabled]{opacity:.3}
.nb svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{height:50px;border-radius:16px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);display:grid;grid-template-columns:1fr 1fr 1fr;padding:5px;position:relative}
.tabs .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:12px;background:var(--gold-grad);box-shadow:0 6px 18px -6px rgba(228,185,91,.7)}
.tabs button{position:relative;z-index:1;font-weight:700;font-size:13.5px;color:var(--ink-2);letter-spacing:.01em;border-radius:12px}
.tabs button.on{color:#1A1200}
.stepidx{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:3px 12px;border-radius:999px;border:1px solid var(--line)}

/* ===== mapa & info ===== */
.sec{margin-top:14px}
.sec h2{font-family:"Inter Tight";font-weight:700;font-size:22px;letter-spacing:-.025em;margin:0 0 10px;padding:0 4px}
.map svg{display:block;width:100%;height:auto}
.map .lake{fill:rgba(28,91,194,.16)}
.map .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.map .trk.done{stroke:url(#gMap);stroke-width:4}
.map .st{fill:#0E1424;stroke:rgba(255,255,255,.7);stroke-width:1.6}
.map .ml{font-family:Inter;font-size:13px;font-weight:700;fill:var(--ink-2)}.map .ml.s{font-size:11px;fill:var(--muted);font-weight:500}
.map .here{fill:var(--red-2);filter:drop-shadow(0 0 8px rgba(255,77,61,.9))}
.map .ring{fill:none;stroke:var(--red-2);stroke-width:1.5;opacity:.7}
.mbody{padding:14px 16px;display:grid;gap:12px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;border:1px solid var(--line-2);background:rgba(255,255,255,.06);text-decoration:none;transition:transform .12s var(--ease)}
.btn:active{transform:scale(.97)}.btn.gold{background:var(--gold-grad);color:#1A1200;border-color:transparent;box-shadow:0 10px 24px -10px rgba(228,185,91,.8)}
.btn.wide{width:100%}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kv .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}.kv .v{font-size:15px;font-weight:700;margin-top:3px}
.compass{display:flex;align-items:center;gap:16px;padding:14px 16px;border-top:1px solid var(--line)}
.compass .dial{width:84px;height:84px;flex:0 0 84px}
.compass .dial svg{width:100%;height:100%;display:block}
.compass .d{font-family:"Inter Tight";font-weight:700;font-size:24px;letter-spacing:-.03em}.compass .k{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
.list{display:grid;gap:8px}
.row2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;background:var(--card-2);border:1px solid var(--line);border-radius:14px}
.row2 .a{font-weight:700;font-size:14.5px}.row2 .b{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:400px){.grid{grid-template-columns:1fr}}
.res{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}.res .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}.res .v{font-family:"Inter Tight";font-size:19px;font-weight:700;margin-top:4px;letter-spacing:-.02em}.res .s{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.4}.res .s b{color:var(--ink)}
.check{list-style:none;margin:0;padding:4px 16px}.check li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15px}.check li:first-child{border-top:0}
.check input{appearance:none;width:24px;height:24px;border:1.6px solid var(--line-2);border-radius:8px;flex:0 0 24px;display:grid;place-items:center;background:rgba(255,255,255,.04)}.check input:checked{background:var(--gold-grad);border-color:transparent}.check input:checked:after{content:"";width:6px;height:11px;border:solid #1A1200;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}.check input:checked+span{color:var(--muted);text-decoration:line-through}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gl div{padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}.gl .w{font-weight:800;font-size:14px}.gl .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.foot{margin:26px 0 0;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}

   <text x="18" y="26" font-family="Inter" font-weight="700" font-size="13" fill="#fff" letter-spacing=".04em">Abfahrt · Départ · Partenza</text><text x="542" y="26" text-anchor="end" font-family="Inter" font-weight="600" font-size="12" fill="rgba(255,255,255,.7)">Gleis · Voie</text>

 /* ponto do PostAuto */

 /* letreiro LED de destino no vagão */

async function fetchLive(){const n=nowZ();if(n.date!==DAY||document.hidden)return;const cur=M[posIdx()].id,vw=M[viewIdx].id;const want=LIVE_Q.filter(q=>q.m.includes(cur)||q.m.includes(vw)||$('#v-mapa').classList.contains('on'));for(const q of want){try{const r=await fetch(`https://transport.opendata.ch/v1/connections?from=${encodeURIComponent(q.from)}&to=${encodeURIComponent(q.to)}&date=${DAY}&time=${q.time}&limit=3`);if(!r.ok)throw 0;const j=await r.json();const c=(j.connections||[]).find(c=>{const s=c.sections.find(s=>s.journey);return s&&q.match.test((s.journey.category||'')+' '+(s.journey.number||'')+' '+(s.journey.name||''))})||(j.connections||[])[0];if(!c)continue;const sec=c.sections.find(s=>s.journey)||c.sections[0];const d=sec.departure,a=c.to;live.data[q.id]={delay:d.delay,platform:d.platform,prog:d.prognosis&&d.prognosis.platform,arrDelay:a.delay};live.ok=true}catch(e){if(live.ok===null)live.ok=false}}updateDynamic();if($("#v-mapa").classList.contains("on"))renderMapa()}
function pills(id){const d=live.data[id];const n=nowZ();if(n.date!==DAY)return `<span class="pill"><i></i>SBB ao vivo a partir de 02/11</span>`;if(!d)return live.ok===false?`<span class="pill"><i></i>SBB ao vivo indisponível</span>`:`<span class="pill"><i></i>consultando SBB…</span>`;let o='';if(d.delay==null||d.delay<=0)o+=`<span class="pill ok"><i></i>SBB · no horário</span>`;else o+=`<span class="pill ${d.delay<10?'late':'bad'}"><i></i>SBB · atraso +${d.delay} min</span>`;if(d.prog&&d.platform&&d.prog!==d.platform)o+=`<span class="pill bad"><i></i>plataforma mudou: ${d.prog}</span>`;else if(d.platform)o+=`<span class="pill"><i></i>plataforma ${d.platform}</span>`;if(d.arrDelay>0)o+=`<span class="pill late"><i></i>chegada +${d.arrDelay}</span>`;return o}

function nowZ(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return{date:`${g('year')}-${g('month')}-${g('day')}`,h:+g('hour')%24,m:+g('minute'),s:+g('second')}}
let store={};try{store=JSON.parse(localStorage.getItem('alpes-v3')||'{}')}catch(e){}
function save(){try{localStorage.setItem('alpes-v3',JSON.stringify(store))}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1600)}
function autoIdx(){const n=nowZ();if(n.date<DAY)return 0;if(n.date>DAY)return M.length-1;const t=n.h*60+n.m;let i=0;M.forEach((m,k)=>{if(t>=mins(m.t))i=k});return i}
let viewIdx=Number.isInteger(store.view)?store.view:autoIdx();   /* passo mostrado */

const poly=a=>a.map(p=>proj(p).map(v=>v.toFixed(1)).join(',')).join(' ');
const STAGE_PT={m0:'gva',m1:'gva',m2:'gva',m3:'nyon',m4:'montreux',m5:'gstaad',m6:'spiez',m7:'iwest',m8:'iwest',m9:'wilderswil',m10:'zweil',m11:'grindelwald'};
function distKm(a,b){const R=6371,dLat=(b[1]-a[1])*Math.PI/180,dLon=(b[0]-a[0])*Math.PI/180,l1=a[1]*Math.PI/180,l2=b[1]*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(l1)*Math.cos(l2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function distToRoute(p){const segs=[[ALL.rivage,PTS.gva],...RAIL.slice(1).map((k,i)=>[PTS[RAIL[i]],PTS[k]])];const c=Math.cos(p[1]*Math.PI/180);const xy=([lon,lat])=>[(lon-p[0])*c*111.32,(lat-p[1])*110.57];let best=1e9;for(const[a,b]of segs){const A=xy(a),B=xy(b);const dx=B[0]-A[0],dy=B[1]-A[1];const l2=dx*dx+dy*dy;let t=l2?((-A[0])*dx+(-A[1])*dy)/l2:0;t=Math.max(0,Math.min(1,t));best=Math.min(best,Math.hypot(A[0]+t*dx,A[1]+t*dy))}return best}

function bearing(a,b){const f1=a[1]*Math.PI/180,f2=b[1]*Math.PI/180,dl=(b[0]-a[0])*Math.PI/180;const y=Math.sin(dl)*Math.cos(f2),x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360}

/* ============================================================ GPS / ALERTAS / BÚSSOLA */
function buzz(kind){try{navigator.vibrate&&navigator.vibrate(kind==='off'?[400,120,400,120,600]:[250,100,250])}catch(e){}try{if(audio){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=kind==='off'?880:660;g.gain.value=.15;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.35)}}catch(e){}}
function checkGeo(){if(!gps.fix)return;const p=[gps.fix.lon,gps.fix.lat];const i=posIdx();const m=M[i];const g=GEO[m.id];if(!g)return;const d=k=>distKm(p,ALL[k]);let changed=false;
  if(g.prep&&!fired.has(m.id+'p')&&d(g.prep[0])<g.prep[1]){fired.add(m.id+'p');bigAlert={kind:'prep',txt:g.prep[2]};buzz('prep');changed=true}
  if(g.off&&!fired.has(m.id+'o')&&d(g.off[0])<g.off[1]){fired.add(m.id+'o');bigAlert={kind:'off',txt:g.off[2]};buzz('off');changed=true}
  if(g.arrive&&!fired.has(m.id+'a')&&d(g.arrive[0])<g.arrive[1]){fired.add(m.id+'a');bigAlert=null;const ni=M.findIndex(x=>x.id===g.arrive[2]);setPos(ni);toast('GPS: chegaram · próximo passo');go(ni);return}
  if(g.leave&&!fired.has(m.id+'l')&&d(g.leave[0])>g.leave[1]){fired.add(m.id+'l');bigAlert=null;const ni=M.findIndex(x=>x.id===g.leave[2]);setPos(ni);toast('GPS: em movimento · próximo passo');go(ni);return}
  if(changed){if(viewIdx!==i)go(i);else renderStep(false)}}
function policyBlocked(){try{if(document.featurePolicy&&document.featurePolicy.allowsFeature)return !document.featurePolicy.allowsFeature('geolocation')}catch(e){}return false}
function startGPS(){if(!('geolocation' in navigator)){gps.err='Este aparelho não expõe localização.';renderMapa();return}if(policyBlocked()){gps.err='<b>Este visualizador bloqueia o GPS.</b> Abra a página em baldasso.github.io/alpes-0211.';renderMapa();return}
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}try{startCompass()}catch(e){}const b=$('#gpsBtn');if(b)b.textContent='Localizando…';
  const ok=pos=>{gps.fix={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy};gps.err=null;const first=!store.gps;store.gps=true;save();const before=bigAlert;checkGeo();if(first||$('#v-mapa').classList.contains('on'))renderMapa();if(bigAlert!==before)renderStep(false);else updateDynamic()};
  const bad=e=>{gps.err=e.code===1?'<b>Permissão negada.</b> No Chrome: cadeado na barra de endereço → Permissões → Localização → Permitir, e toque de novo.':'<b>Sem sinal de GPS ainda.</b> Tente perto de uma janela.';renderMapa()};
  gps.ok=ok;gps.bad=bad;try{navigator.geolocation.getCurrentPosition(ok,bad,{enableHighAccuracy:true,timeout:15000,maximumAge:5000})}catch(e){gps.err='Localização indisponível.';renderMapa()}}
function pollGPS(){if(!gps.ok||document.hidden)return;try{navigator.geolocation.getCurrentPosition(gps.ok,()=>{},{enableHighAccuracy:true,timeout:12000,maximumAge:15000})}catch(e){}}
function onOrient(e){let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(typeof e.alpha==='number')h=(360-e.alpha)%360;if(h!=null){compass.heading=h;const a=document.getElementById('cArrow');if(a&&gps.fix){const g=GEO[M[posIdx()].id];if(g){const br=bearing([gps.fix.lon,gps.fix.lat],ALL[g.target]);gsap.to(a,{rotate:(br-h+360)%360,duration:.4,ease:'power2.out',transformOrigin:'42px 42px'})}}}}
function startCompass(){if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')window.addEventListener('deviceorientation',onOrient)}).catch(()=>{})}else{if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onOrient);else window.addEventListener('deviceorientation',onOrient)}}


/* ============================================================ CONFETE */
const CF={c:null,ctx:null,ps:[],raf:null};
function confetti(big){
  const c=CF.c||(CF.c=document.getElementById('confetti'));const ctx=CF.ctx||(CF.ctx=c.getContext('2d'));
  const dpr=Math.min(2,window.devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#F7DE9A','#E4B95B','#B9872F','#FFFFFF','#FF4D3D','#EB0000','#FFCC00'];
  const n=big?220:120;const cx=innerWidth/2,cy=innerHeight*0.35;
  for(let i=0;i<n;i++){const a=(-Math.PI/2)+(Math.random()-.5)*Math.PI*1.1;const v=(big?9:7)+Math.random()*9;
    CF.ps.push({x:cx+(Math.random()-.5)*60,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,col:cols[(Math.random()*cols.length)|0],life:1,decay:.004+Math.random()*.006,wob:Math.random()*Math.PI*2})}
  if(!CF.raf)loop();
  function loop(){ctx.clearRect(0,0,innerWidth,innerHeight);CF.ps=CF.ps.filter(p=>p.life>0&&p.y<innerHeight+40);
    for(const p of CF.ps){p.vy+=.22;p.vx*=.985;p.vy*=.985;p.x+=p.vx+Math.sin(p.wob+=.08)*.6;p.y+=p.vy;p.r+=p.vr;p.life-=p.decay;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.4));ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3))+1);ctx.restore()}
    if(CF.ps.length){CF.raf=requestAnimationFrame(loop)}else{CF.raf=null;ctx.clearRect(0,0,innerWidth,innerHeight)}}
}
function celebrate(){confetti(true);setTimeout(()=>confetti(false),700);setTimeout(()=>confetti(false),1500);try{navigator.vibrate&&navigator.vibrate([80,60,80,60,200])}catch(e){}
  const b=document.querySelector('.fin .big');if(b)gsap.fromTo(b,{scale:.7,opacity:0},{scale:1,opacity:1,duration:.9,ease:'elastic.out(1,.5)'});
  gsap.fromTo('.fin .stats div',{y:20,opacity:0},{y:0,opacity:1,duration:.6,stagger:.12,delay:.4,ease:'power3.out'})}

/* ============================================================ SHELL */
function setView(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));const k={guia:0,mapa:1,info:2}[v];gsap.to('#ind',{xPercent:k*100,duration:.35,ease:'power3.out'});$('#prev').style.visibility=$('#next').style.visibility=v==='guia'?'visible':'hidden';if(v==='mapa')renderMapa();if(v==='info')renderInfo();window.scrollTo({top:0});location.hash=v==='guia'?'':'#'+v}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
$('#prev').addEventListener('click',()=>go(viewIdx-1));$('#next').addEventListener('click',()=>go(viewIdx+1));
let sx=null,sy=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(sx==null||!$('#v-guia').classList.contains('on'))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>90&&Math.abs(dx)>2.5*Math.abs(dy)){go(viewIdx+(dx<0?1:-1))}sx=sy=null},{passive:true});
function tick(){const n=nowZ();$('#hm').textContent=`${pad(n.h)}:${pad(n.m)}`;const t=n.h*60+n.m;const p=n.date<DAY?0:n.date>DAY?1:Math.max(0,Math.min(1,(t-mins('08:30'))/(mins('16:40')-mins('08:30'))));$('#slimBar').style.width=(p*100).toFixed(1)+'%'}
function renderAll(){renderStep(false);renderLine(false)}
renderStep(true);renderLine(false);tick();
let timers=[];function startTimers(){stopTimers();timers=[setInterval(tick,15000),setInterval(()=>{updateDynamic();renderLine(false)},30000),setInterval(fetchLive,120000),setInterval(()=>{if(store.gps)pollGPS()},30000)]}function stopTimers(){timers.forEach(clearInterval);timers=[]}
startTimers();fetchLive();
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopTimers();gsap.globalTimeline.pause()}else{gsap.globalTimeline.resume();tick();updateDynamic();fetchLive();if(store.gps)pollGPS();startTimers()}});
if(store.lineCollapsed)$('.hdr').classList.add('collapsed');
$('#lineToggle').addEventListener('click',()=>{const h=$('.hdr');h.classList.toggle('collapsed');store.lineCollapsed=h.classList.contains('collapsed');save()});
if(location.hash==='#mapa')setView('mapa');else if(location.hash==='#info')setView('info');
(async()=>{try{if(navigator.permissions&&navigator.permissions.query){const st=await navigator.permissions.query({name:'geolocation'});if(st.state==='granted'||store.gps){startGPS()}}else if(store.gps)startGPS()}catch(e){if(store.gps)startGPS()}})();
</script>
